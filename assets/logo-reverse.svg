<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 128" width="400" height="128" role="img" aria-label="众策通 标志（反白版）">
  <title>众策通 · 反白版（深底）</title>
  <defs>
    <linearGradient id="zctBrandR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A4E9E"/>
      <stop offset="1" stop-color="#2064C9"/>
    </linearGradient>
    <linearGradient id="zctGoldR" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#EFA318"/>
      <stop offset="1" stop-color="#FFD26B"/>
    </linearGradient>
    <clipPath id="zctMarkClipR">
      <rect x="0" y="0" width="128" height="128" rx="30" ry="30"/>
    </clipPath>
  </defs>

  <!-- 徽章：白底 + 品牌蓝图形（深底上更清晰） -->
  <g>
    <rect x="0" y="0" width="128" height="128" rx="30" ry="30" fill="#ffffff"/>
    <g clip-path="url(#zctMarkClipR)">
      <polygon points="0,0 68,0 0,84" fill="#123A72" opacity="0.05"/>
      <polygon points="128,128 128,60 52,128" fill="#123A72" opacity="0.06"/>
    </g>
    <rect x="32" y="72" width="14" height="34" rx="7" fill="url(#zctBrandR)"/>
    <rect x="55" y="56" width="14" height="50" rx="7" fill="url(#zctBrandR)"/>
    <rect x="78" y="40" width="14" height="66" rx="7" fill="url(#zctBrandR)"/>
    <path d="M30 72.3 L96 26.3" stroke="url(#zctGoldR)" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <text x="160" y="74" textLength="200" lengthAdjust="spacing"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC','Noto Sans SC',sans-serif"
        font-size="62" font-weight="800" letter-spacing="4" fill="#FFFFFF">众策通</text>

  <text x="160" y="106" textLength="200" lengthAdjust="spacing"
        font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="600" letter-spacing="5" fill="#A9C4E8">ZHONGCETONG</text>
</svg>
