    <rect x="78" y="40" width="14" height="66" rx="7" fill="#ffffff" opacity="0.94"/>
    <path d="M30 72.3 L96 26.3" stroke="url(#zctGoldE)" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <text x="160" y="70" textLength="330" lengthAdjust="spacing"
