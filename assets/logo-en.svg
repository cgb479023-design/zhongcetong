<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 128" width="540" height="128" role="img" aria-label="ZhongceTong logo (English)">
  <title>众策通 · English Version</title>
  <defs>
    <linearGradient id="zctBrandE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A72"/>
      <stop offset="0.55" stop-color="#1A4E9E"/>
      <stop offset="1" stop-color="#2064C9"/>
    </linearGradient>
    <linearGradient id="zctGoldE" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#EFA318"/>
